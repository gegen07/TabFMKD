[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabfm-kd"
version = "0.1.0"
description = "Knowledge distillation from Google TabFM into an XGBoost student."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Germano Barcelos" }]
keywords = [
    "tabfm",
    "knowledge-distillation",
    "xgboost",
    "tabular",
    "foundation-model",
    "tabicl",
    "tabpfn",
    "mitra",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
tabfm = ["tabfm[pytorch]>=1.0.0"]
tabicl = ["tabicl>=2.0.0"]
tabpfn = ["tabpfn>=2.0.0"]
mitra = ["autogluon.tabular[mitra]>=1.6"]
dev = ["pytest>=8.0"]

[project.scripts]
tabfm-kd = "tabfm_kd.cli:main"

[project.urls]
Homepage = ""

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
